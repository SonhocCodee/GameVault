name = "game-vault-worker"
main = "worker/src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GOOGLE_CLIENT_ID = "772752742447-aup07ndihefv5vpi9o4nus9aj1vqso1q.apps.googleusercontent.com"
# Optional: Add a separate Web Application OAuth Client ID if you want direct Google Sign-In on /admin
# WEB_GOOGLE_CLIENT_ID = "YOUR_WEB_CLIENT_ID.apps.googleusercontent.com"
ENVIRONMENT = "production"
SESSION_SECRET = "gamevault-session-secret-key-production-32chars-min"

# Serve Web Admin Dashboard (/admin) from built static assets
[assets]
directory = "worker/admin-assets"
binding = "ASSETS"
run_worker_first = true

# D1 SQLite Database Binding
[[d1_databases]]
binding = "DB"
database_name = "game-vault-d1"
migrations_dir = "worker/migrations"
database_id = "2f252069-15b0-4957-a6d2-c31be05f7344"

# Cloudflare R2 Images Bucket Binding (Enable if you activate R2 in Cloudflare dashboard)
# [[r2_buckets]]
# binding = "IMAGES_BUCKET"
# bucket_name = "game-vault-images"
# preview_bucket_name = "game-vault-images-preview"
