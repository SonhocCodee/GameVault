name: CI (Dev & Test Branches)

on:
  push:
    branches:
      - dev
      - test
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build
        shell: pwsh
        run: |
          npx tsc --noEmit
          npm run build

      - name: Run tests
        run: npm test
