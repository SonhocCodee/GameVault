name: Release Windows Installer (Prod)

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build clean bundle
        shell: pwsh
        run: |
          npx tsc --noEmit
          npm run build
          Remove-Item -Force -ErrorAction SilentlyContinue dist-electron/cloud-config.json, dist-electron/*.map

      - name: Build and upload draft Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); if(Array.isArray(p.build?.publish)&&p.build.publish[0]) p.build.publish[0].releaseType='draft'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2));"
          npx electron-builder --win --publish always

      - name: Publish release after all artifacts are uploaded
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release edit "v$version" --draft=false
